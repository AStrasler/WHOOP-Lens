name: Health Connect migration isolation
on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/migrations/*health_connect*'
      - 'supabase/tests/health-connect-rls-smoke.sql'
      - '.github/workflows/health-connect-schema.yml'
  pull_request:
    paths:
      - 'supabase/migrations/*health_connect*'
      - 'supabase/tests/health-connect-rls-smoke.sql'
      - '.github/workflows/health-connect-schema.yml'

permissions:
  contents: read

jobs:
  rls-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable-test-only
      PGDATABASE: smoke
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test owner isolation on disposable PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/health-connect-rls-smoke.sql
